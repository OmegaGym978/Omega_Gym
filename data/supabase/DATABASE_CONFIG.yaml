model_status:
  overall: active
  last_reviewed: 2026-10-29
  approved_by: "admin"
  notes: "Flujo SMS/phone de registro eliminado (solo email). Migración 013 (20260808000001): RPC hard_delete_member para borrado físico de perfiles por admin (evita auto-eliminación y borrar el último admin; limpia cuenta auth y cascades). Migración 013 aplicada 2026-08-08 en dev y producción. Producción (proyecto xlawavqe... ref xlawavqe) no usa historial schema_migrations: se aplicó el RPC vía SQL directo y se recargó caché PostgREST (NOTIFY pgrst 'reload schema'). Dev (proyecto jaltwjci...) sí usa el historial y el push quedó aplicado. Pendiente de dashboard: la configuración de auth (Site/Redirect URLs con dominio Vercel, enable email confirmations, SMTP custom) se debe revisar en producción. Migración 20260821000001 (SPEC_001, TKT-OMEGYM-019, 2026-08-21): rutinas personales compartibles por código — training_plans.kind ('trainer'|'personal', DEFAULT trainer retrocompatible), share_code + índice único parcial, RLS CRUD personal para miembros (traducción auth_user_id) y RPCs SECURITY DEFINER generate_share_code/revoke_share_code/import_routine_by_code. Aplicada SOLO en DEV vía db push; PENDIENTE en producción hasta cerrar TKT-OMEGYM-022. Migración 20260821120000 (TKT-OMEGYM-024, 2026-08-21): training_plans.show_in_plan BOOLEAN NOT NULL DEFAULT true — visibilidad de rutinas personales en Mi plan; aplicada SOLO en DEV. Migración 20260821130000 (TKT-OMEGYM-025, 2026-08-21): plan_assignments.visible BOOLEAN NOT NULL DEFAULT true (preferencia por miembro) + RPC SECURITY DEFINER set_assignment_visibility con fallback legacy vía show_in_plan; aplicada SOLO en DEV. Migración 20260821140000 (FIX TKT-OMEGYM-025, 2026-08-21): set_assignment_visibility corregido — usaba auth.uid() directo y fallaba en cuentas vinculadas (profiles.id ≠ auth.uid()); ahora traduce vía profiles.auth_user_id con control FOUND y search_path=''; aplicada SOLO en DEV. APLICACIÓN A PRODUCCIÓN (ref xlawavqceyprraeyrmtm, 2026-08-21): las 4 migraciones de la sesión (SPEC_001/019, 120000/024, 130000/025 y FIX 140000) se aplicaron vía SQL directo por Management API con token nuevo, en orden cronológico; PostgREST recargado (NOTIFY pgrst). Verificado: 4 columnas (kind, share_code, show_in_plan, visible), 4 RPCs + grants a authenticated, 6 políticas RLS personales (training_plans y plan_exercises). Producción al día con DEV en este alcance; validación funcional E2E sigue pendiente (TKT-OMEGYM-022). Migración 20261029000001 (TKT-OMEGYM-027, 2026-10-29): alcance del staff sobre planes — training_plans_select y plan_exercises_select limitan a admin/entrenador a kind='trainer', y sus políticas de escritura quedan igualmente limitadas (las rutinas personales de los miembros dejan de ser legibles/modificables por el staff; regla 5 de SPEC_001 ahora con enforce real). Escrita; aplicada en DEV el 2026-10-29 vía Management API (con verificación RLS: admin/entrenador solo leen kind='trainer', miembros conservan sus rutinas personales; historial schema_migrations registrado con 20261029000001). PENDIENTE en PROD: el token de Management API disponible solo expone el proyecto DEV, se requiere credencial de la cuenta dueña del proyecto xlawavqceyprraeyrmtm. No altera las políticas members_personal_*. Sin migración (TKT-OMEGYM-029, 2026-10-29): plan_exercises.day queda como columna legacy — las rutinas y planes dejan de repartirse por día, la app escribe day=null y ordena por order_index; no se borran datos históricos ni se altera el esquema. Migración 20261029000002 (TKT-OMEGYM-037, 2026-10-29): plan_exercises.set_details JSONB (series peso/reps por ejercicio), CHECK de tipo arreglo y RPC import_routine_by_code recreado para copiar la columna. ESCRITA; APLICADA en DEV el 2026-10-29 vía Management API (columna jsonb, CHECK plan_exercises_set_details_is_array, RPC import_routine_by_code con set_details y versión 20261029000002 registrada en schema_migrations; PostgREST recargado y REST select=set_details verificado 200). PENDIENTE en PROD: el token disponible solo expone el proyecto DEV (Omega_Gym). Migración 20261029000003 (TKT-OMEGYM-040/041, 2026-10-29): training_plans.scheduled_days SMALLINT[] (0=lun…6=dom) con CHECK y GIN; tablas workout_sessions y workout_sets, índices y RLS solo para el miembro dueño (8 políticas). APLICADA en DEV y verificada (columna ARRAY, tablas, RLS y prueba con JWT simulado: dueño ve 1, otro miembro 0, admin 0, inserción ajena rechazada 42501); versión registrada. PENDIENTE en PROD. Migración 20261029000004 (TKT-OMEGYM-042/043, 2026-10-29): exercises.created_by (NULL = catálogo global, uuid = ejercicio personal), índice, RLS de lectura global/propia y escritura propia, y FK plan_exercises.exercise_id recreada con ON DELETE SET NULL. APLICADA en DEV y verificada con JWT simulado (propio 1, otro 0, admin 1, catálogo global 1324, actualización ajena 0, inserción global rechazada 42501); versión registrada. PENDIENTE en PROD. Migración 20261029000005 (TKT-OMEGYM-045, 2026-10-29): tabla exercise_notes (miembro, ejercicio, texto, fecha) con índice y RLS privada (4 políticas). APLICADA en DEV y verificada con JWT simulado (dueño 1, otro miembro 0, admin 0, inserción ajena rechazada 42501, borrado propio OK); versión registrada. UI RETIRADA el 2026-10-29 a solicitud del dueño (TKT-OMEGYM-045): la tabla se conserva sin uso y nunca se aplicó en PROD."

